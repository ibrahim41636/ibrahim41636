name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-content.mjs services
      - run: node scripts/validate-content.mjs industries
      - run: npm test
      - run: npx tsc -p functions/tsconfig.json
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    # Optional: deploy from Actions instead of Cloudflare's Git integration (the recommended path,
    # see docs/deploy-guide-ar.html). Enable by setting the repository variable
    # DEPLOY_WITH_ACTIONS=true plus the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets.
    # Off by default so the site is never deployed twice.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_WITH_ACTIONS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
