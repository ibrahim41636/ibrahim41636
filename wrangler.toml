# Cloudflare Worker with static assets: the Astro build (dist/) plus the form endpoint
# POST /api/request (worker/index.ts → functions/api/request.ts).
# `name` must match the Worker's name in the Cloudflare dashboard (Workers Builds checks it).
name = "ibrahim41636"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
# Keep the *.workers.dev URL and per-version preview URLs on (used for checks before
# selorin.co is active); custom domains are added in the dashboard.
workers_dev = true
preview_urls = true

# Workers Builds runs `npx wrangler deploy`, which runs this build first.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Run the Worker before assets so www.selorin.co → selorin.co is a single 301 for every path.
run_worker_first = true

[observability]
enabled = true

# Preview deployments (Workers Builds runs `npx wrangler preview` for pull requests). Previews never
# e-mail real people: emails are logged instead of sent.
[previews.vars]
SALES_EMAIL = "sales@selorin.co"
MAIL_FROM = "Selorin Website <website@selorin.co>"
ALLOWED_ORIGINS = "https://selorin.co,https://www.selorin.co"
SEND_CONFIRMATION = "false"
EMAIL_DRY_RUN = "true"

# Social publishing hub (functions/api/social.ts): every 15 minutes queue posts for new articles
# and publish due posts to the connected accounts. Does nothing until D1 and a channel are set up.
[triggers]
crons = ["*/15 * * * *"]

[vars]
SALES_EMAIL = "sales@selorin.co"
MAIL_FROM = "Selorin Website <website@selorin.co>"
ALLOWED_ORIGINS = "https://selorin.co,https://www.selorin.co"
SEND_CONFIRMATION = "true"

# Secrets (dashboard → Worker → Settings → Variables and Secrets, type "Secret", or
# `npx wrangler secret put NAME`): RESEND_API_KEY, ADMIN_TOKEN (staff dashboard /ar/admin/), TURNSTILE_SECRET,
# and optionally LEAD_WEBHOOK_URL / LEAD_WEBHOOK_SECRET.
# Social accounts (each channel turns on when its secrets are set — see docs/social-funnel-ar.md):
#   LinkedIn: LINKEDIN_ACCESS_TOKEN, LINKEDIN_ORG_ID · X: X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET
#   Facebook/Instagram: FACEBOOK_PAGE_ID, FACEBOOK_PAGE_TOKEN, INSTAGRAM_USER_ID
#   Google Business Profile: GBP_CLIENT_ID, GBP_CLIENT_SECRET, GBP_REFRESH_TOKEN, GBP_ACCOUNT_ID, GBP_LOCATION_ID
#   TikTok: TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET, TIKTOK_REFRESH_TOKEN · YouTube: YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN
#   Others via Make or Zapier: SOCIAL_WEBHOOK_URL, SOCIAL_WEBHOOK_SECRET · Search engines: INDEXNOW_KEY

# Lead log + sequential request IDs + rate limiting + request tracking (/track/). Create with:
#   npx wrangler d1 create selorin-leads   → paste the database_id below
#   npx wrangler d1 migrations apply selorin-leads --remote   (applies 0001–0004)
[[d1_databases]]
binding = "DB"
database_name = "selorin-leads"
database_id = "e65bec51-3b21-44b5-afa2-1970f54519eb"
migrations_dir = "migrations"
